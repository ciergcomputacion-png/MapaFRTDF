<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mapa Interactivo del Colegio</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/controles.css">
    <link rel="stylesheet" href="css/mapa.css">

</head>

<body>

<header>

    <h1>Mapa Interactivo del Colegio</h1>

</header>

<div id="barraSuperior">

    <!-- PLANTA -->

    <div class="grupo">

        <label>Planta</label>

        <div class="botonesPlanta">

            <button id="btnPlantaBaja">

                Planta Baja

            </button>

            <button id="btnPlantaAlta">

                Planta Alta

            </button>

        </div>

    </div>

    <!-- AULAS -->

    <div class="grupo">

        <label for="cmbAulas">

            Aula

        </label>

        <select id="cmbAulas">

            <option value="">

                Seleccione un aula...

            </option>

        </select>

    </div>

    <!-- CURSOS -->

    <div class="grupo">

        <label for="cmbCursos">

            Curso

        </label>

        <select id="cmbCursos">

            <option value="">

                Seleccione un curso...

            </option>

        </select>

    </div>

    <!-- BOTONES -->

    <div class="grupoBotones">

        <button id="btnVista">

            Vista Completa

        </button>

    </div>

</div>

<div id="contenedorMapa">

    <div id="visorSVG"></div>

</div>

<footer>

    <span id="estado">

        Inicializando...

    </span>

</footer>

<script src="js/utilidades.js"></script>
<script src="js/datos.js"></script>
<script src="js/visor.js"></script>
<script src="js/buscador.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>

</html>
